[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.coverage.run]
omit = [
    ".venv/*",
    "*/migrations/*",
    "manage.py",
    "config/*",
    "conftest.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
